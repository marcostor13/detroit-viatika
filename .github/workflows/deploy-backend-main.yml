name: Deploy backend (production)

on:
  push:
    branches:
      - main
    paths:
      - 'viatika-back/**'

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment via webhook
        run: |
          curl --silent --show-error --fail \
            --max-time 30 \
            "${{ secrets.COOLIFY_BACKEND_PROD_WEBHOOK_URL }}"
