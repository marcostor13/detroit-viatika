<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <!-- Sin viewport-fit=cover a proposito. Con ese valor y un WebView 140 o
       superior, Capacitor deja pasar los insets del sistema y espera que el CSS
       los maneje (ver shouldPassthroughInsets en SystemBars), asi que la app
       dibuja por debajo de la barra de estado y de la de navegacion y los
       botones del borde inferior quedan tapados. Sin el, Capacitor compensa las
       barras de forma nativa y el contenido queda dentro del area segura. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Rendiciones</title>
  <meta name="description" content="Plataforma de gestión de rendiciones de viáticos y gastos empresariales.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#ffffff">
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Preconexión con orígenes de fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fuentes: Zilla Slab (encabezados) + Inter (cuerpo) -->
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
